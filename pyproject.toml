[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-duck"
version = "0.1.0"
description = "Duck or pause the music when a voice assistant's wake word fires, confirm the wake word with a second gate, put the music back. Standard library only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
wake-duck = "wake_duck.__main__:main"

[tool.setuptools]
packages = ["wake_duck"]
